# Fluxbee lab — Phase 0: motherbee only.
#
# systemd runs as PID 1 inside the container (cgroup v2 + privileged). Phases 1-2
# (worker / egress containers + add_hive over SSH) get added as services here.
#
#   docker compose -f lab/docker-compose.yml up -d --build
#   docker compose -f lab/docker-compose.yml logs -f motherbee
#   docker exec -it fluxbee-motherbee bash
#
services:
  motherbee:
    build:
      context: ..
      dockerfile: lab/Dockerfile
    image: ghcr.io/4iplatform/fluxbee-lab:latest
    container_name: fluxbee-motherbee
    hostname: motherbee
    # systemd-in-docker (cgroup v2). Privileged keeps Phase 0 friction-free; the
    # egress role later needs NET_ADMIN regardless.
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
      # NB: /tmp stays on the overlay fs (exec) — Docker tmpfs defaults to noexec,
      # which breaks ssh askpass during the add_hive password bootstrap.
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Persist fluxbee state across restarts (drop the volume to reset).
      - motherbee_state:/var/lib/fluxbee
      # Bind the boot provisioner so it can be iterated without rebuilding the image.
      - ./lab-install.sh:/usr/local/bin/lab-install.sh:ro
    ports:
      # Admin HTTP API (hive.yaml admin.listen). Also reachable via docker exec.
      - "8080:8080"
      # Architect HTTP UI/API.
      - "3000:3000"
      # Temporary direct HTTP ingress for IO.linkedhelper nodes in the no-Edge path.
      # Range, not a single port: the cloud allocates one port per managed
      # instance (19091 + N), so every provisioned node must be reachable from
      # the host for the cloud's /schema probe and the adapter's /v1/poll.
      - "19091-19100:19091-19100"
    networks:
      - flux

  # Phase 1: an EMPTY Linux box (sshd + admin login + Postgres, no fluxbee).
  # motherbee bootstraps it via `add_hive` over SSH. Reuses the same image; the
  # bind-mount makes the baked one-shot run worker-install.sh instead.
  worker1:
    image: ghcr.io/4iplatform/fluxbee-lab:latest
    container_name: fluxbee-worker1
    hostname: worker1
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
      # NB: /tmp stays on the overlay fs (exec) — Docker tmpfs defaults to noexec,
      # which breaks ssh askpass during the add_hive password bootstrap.
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ./worker-install.sh:/usr/local/bin/lab-install.sh:ro
    networks:
      - flux

networks:
  flux:
    name: fluxbee-lab

volumes:
  motherbee_state:
