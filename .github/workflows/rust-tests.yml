name: rust-tests

# cargo fmt --check, cargo clippy (warnings denied) and cargo test for both Rust workspaces (the
# root one and nodes/io) on each push or pull request that touches Rust code, the baked system
# policy, the contract fixtures shared with the Go tests, or ai.generic's tool catalog (its test
# `the_tool_catalog_matches_the_cards` is the catalog's parity check with the tools' cards). The
# structural lints clippy leaves alone are allowed once per workspace, in its Cargo.toml's
# [workspace.lints.clippy]. Toolchain pinned to the one fb-build builds the .deb with.

on:
  pull_request:
    paths:
      - "src/**"
      - "crates/**"
      - "nodes/**"
      - "policy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/**"
      - "go/fluxbee-go-sdk/testdata/**"
      - "go/sy-opa-rules/testdata/**"
      - "docs/reference/agent-tools.*"
      - ".github/workflows/rust-tests.yml"
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "crates/**"
      - "nodes/**"
      - "policy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packaging/**"
      - "go/fluxbee-go-sdk/testdata/**"
      - "go/sy-opa-rules/testdata/**"
      - "docs/reference/agent-tools.*"
      - ".github/workflows/rust-tests.yml"

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "."
          - "nodes/io"
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Ubuntu's protobuf-compiler first; protoc's own GitHub release (the same 21.12, Ubuntu's
      # 3.21.12) when Ubuntu's archive cannot be reached: on 2026-11-11 *.ubuntu.com did not
      # resolve on the runners for hours and every run failed here.
      - name: Install protoc
        run: |
          if ! (timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y protobuf-compiler); then
            echo "::warning::apt could not install protobuf-compiler; protoc 21.12 from its GitHub release"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/protoc.zip" \
              https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
            sudo unzip -o -q "$RUNNER_TEMP/protoc.zip" -d /usr/local bin/protoc 'include/*'
          fi
          protoc --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ matrix.workspace }} -> target"
          # Saved on main only, and every branch reads main's: the repo's caches are capped at
          # 10 GB and each branch kept its own copy, about 2 GB (lab/logbook/METHOD.md §9).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
