# Build the fluxbee lab image and push it to GHCR so devs can `docker pull`
# instead of compiling locally (~25 min). Triggered manually or on a `lab-v*`
# tag — NOT on every push, to keep CI minutes in check (the build is heavy).
name: lab-image

on:
  workflow_dispatch: {}          # Run manually from the Actions tab.
  push:
    tags:
      - 'lab-v*'                  # e.g. git tag lab-v0.1 && git push --tags

permissions:
  contents: read
  packages: write                # lets GITHUB_TOKEN push to GHCR (no PAT needed)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90          # full Rust+Go compile is long
    steps:
      - name: Free up disk space
        # The fat build (toolchain + target/ + ~2.2GB image) can exceed the
        # default runner disk. Reclaim space the build doesn't need.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxbee-lab
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lab/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache across runs so unchanged-source rebuilds are faster.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # amd64 only for now. arm64 (Apple Silicon) needs a separate, slow
          # emulated build — add `platforms: linux/amd64,linux/arm64` when needed.
          provenance: false
