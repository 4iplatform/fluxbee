# Build the fluxbee lab images and push them to GHCR so devs can `docker pull`
# instead of compiling locally (~25 min). Public repo → GHCR storage + Actions
# are free/unlimited. Builds BOTH flavors: `slim` (multi-stage, ~hundreds of MB,
# also tagged `latest`) and `fat` (single-stage, ~2.2 GB, full toolchain).
# Triggered manually or on a `lab-v*` tag (not every push).
name: lab-image

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'lab-v*'                  # e.g. git tag lab-v0.1 && git push --tags

permissions:
  contents: read
  packages: write                # lets GITHUB_TOKEN push to GHCR (no PAT needed)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: slim
            dockerfile: lab/Dockerfile.slim
            also_latest: true     # slim is the default `:latest`
          - flavor: fat
            dockerfile: lab/Dockerfile
            also_latest: false
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxbee-lab
          tags: |
            type=raw,value=${{ matrix.flavor }}
            type=sha,prefix=${{ matrix.flavor }}-,format=short
            type=raw,value=latest,enable=${{ matrix.also_latest }}

      - name: Build and push (${{ matrix.flavor }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
          # amd64 only. arm64 (Apple Silicon) = a separate, slow emulated build.
          provenance: false
