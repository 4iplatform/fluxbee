# Fluxbee: installed by the fluxbee package as /etc/needrestart/conf.d/fluxbee.conf (FINDINGS A-39).
#
# Managed nodes run as transient units (fluxbee-node-*) that sy-orchestrator creates with the
# runtime version baked into their ExecStart. A fluxbee upgrade removes the old runtime
# directory, so needrestart restarting such a unit re-runs a path that no longer exists
# (status=203/EXEC, a crash loop of the node). The orchestrator owns these restarts: when it
# boots after the upgrade it moves every node that follows `current` to the new version with
# one controlled restart.
$nrconf{override_rc}{qr(^fluxbee-node-)} = 0;
#
# The core units too (FINDINGS A-45): an upgrade leaves the core serving on the old binaries and
# the orchestrator's boot restarts them in its start order (rt-gateway first, SY.vault last).
# needrestart would restart them at the same time and in no order. The trade-off: a library
# update outside fluxbee no longer restarts them; they pick it up at the next fluxbee upgrade or
# reboot.
$nrconf{override_rc}{qr(^rt-gateway)} = 0;
$nrconf{override_rc}{qr(^sy-)} = 0;
