hive_id: "motherbee"
role: motherbee

# Hive-wide AI engine used by SY.* consumers, and by every AI node (ai.generic)
# that names no provider or model of its own: such a node takes the model listed
# here for its provider. If this section is omitted, the runtime falls back to
# OpenAI with model gpt-5.5.
ai:
  default_provider: openai
  providers:
    openai:
      model: "gpt-5.5"
    # anthropic:
    #   model: "claude-sonnet-5-5"

# WAN / inter-hive gateway.
wan:
  listen: "0.0.0.0:9000"
  gateway_name: "RT.gateway"
  mtls: required
  uplinks:
    - address: "192.168.8.220:9000"

# Local admin HTTP API.
admin:
  listen: "127.0.0.1:8080"
  # Optional absolute content origin returned alongside /public/<key>.
  # public_base_url: "https://content.example.com"

# Archi's HTTP UI/API. Loopback only: it has no authentication (FINDINGS A-46). Use it on the
# motherbee itself, or from another machine through an SSH tunnel:
#   ssh -L 3000:127.0.0.1:3000 <user>@<motherbee>
architect:
  listen: "127.0.0.1:3000"

# Shared filesystem root used by admin/orchestrator.
storage:
  path: "/var/lib/fluxbee"

# Identity runtime settings.
identity:
  sync:
    port: 9100
    # Per-hive HMAC auth on the :9100 replication channel. REQUIRED by default
    # (the code fails closed even if this line is absent). Only set to "disabled"
    # on a strictly isolated/loopback network — it lets any reachable host
    # exfiltrate and poison identity state.
    auth: required

# Government/frontdesk wiring.
government:
  identity_frontdesk: "SY.frontdesk.gov@motherbee"

# What the release defines for each role lives in the code, not here
# (src/release_settings.rs, docs/hive-config-update-v1.md §3): the SY nodes each role runs and the
# blob's and dist's topology. This file holds the hive's own paths and ports.

# The blob store's path, and Syncthing's API port and home.
blob:
  path: "/var/lib/fluxbee/blob"
  sync:
    api_port: 8384
    data_dir: "/var/lib/fluxbee/syncthing"

# The runtime artifact distribution's path.
dist:
  path: "/var/lib/fluxbee/dist"
