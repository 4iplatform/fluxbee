hive_id: "motherbee"
role: motherbee

# WAN / inter-hive gateway.
wan:
  listen: "0.0.0.0:9000"
  gateway_name: "RT.gateway"
  uplinks:
    - address: "192.168.8.220:9000"

# Local NATS broker for control/data plane.
nats:
  mode: embedded
  port: 4222

# Local admin HTTP API.
admin:
  listen: "127.0.0.1:8080"

# Local architect HTTP UI/API (typically exposed through reverse proxy).
architect:
  listen: "127.0.0.1:3000"

# Shared filesystem root used by admin/orchestrator.
storage:
  path: "/var/lib/fluxbee"

# Identity runtime settings.
identity:
  sync:
    port: 9100

# Government/frontdesk wiring.
government:
  identity_frontdesk: "SY.frontdesk.gov@motherbee"

# Blob runtime config.
blob:
  enabled: true
  path: "/var/lib/fluxbee/blob"
  sync:
    enabled: true
    tool: "syncthing"
    api_port: 8384
    data_dir: "/var/lib/fluxbee/syncthing"

# Runtime artifact distribution config.
dist:
  path: "/var/lib/fluxbee/dist"
  sync:
    enabled: true
    tool: "syncthing"

# Declarative SY topology per hive role. SY.identity is always first by
# contract: it seeds the fixed fluxbee root tenant and deterministic system
# ILKs before any other SY needs identity metadata. `nodes` is the start
# order; `wait_for` is the subset the orchestrator blocks on before
# continuing bootstrap. Workers do not run SY.vault.
system_nodes:
  motherbee:
    # Boot order matters in Model D' (vault):
    #
    # 1. SY.identity FIRST — seeds the fixed root tenant and deterministic
    #    system ILKs from this same list.
    # 2. SY.config.routes and all consumers SECOND (admin, architect,
    #    storage, cognition, opa.rules, policy, timer, wf-rules, frontdesk-gov)
    #    so they REGISTER WITH THE ROUTER before vault emits its
    #    bootstrap broadcast. Each consumer tolerates VAULT_UNAVAILABLE
    #    at its initial lookup — it logs degraded and waits for the
    #    rescue broadcast.
    # 3. SY.vault LAST — opens vault.db, registers, and emits one
    #    VAULT_SECRET_CHANGED { op=put } per existing secret. Because
    #    every consumer is already in the router's registry at this
    #    point, the broadcasts land and the consumers react
    #    (exit/refresh) to converge to configured.
    #
    # Why vault last (counter-intuitive): broadcasts only reach nodes
    # registered at the moment of emission (router/mod.rs:1066 —
    # `for (uuid, handle) in nodes_guard.iter()`). If vault emits
    # first, no consumer is registered yet and the broadcast is lost,
    # leaving the cluster stuck. Vault-last guarantees delivery.
    nodes:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.admin
      - SY.architect
      - SY.storage
      - SY.cognition
      - SY.policy
      - SY.timer
      - SY.wf-rules
      - SY.frontdesk.gov
      - SY.vault
    wait_for:
      - SY.config.routes
      - SY.identity
      - SY.opa.rules
      - SY.admin
      - SY.cognition
      - SY.policy
      - SY.timer
      - SY.vault
  worker:
    nodes:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.cognition
      - SY.policy
      - SY.timer
      - SY.wf-rules
    wait_for:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.cognition
      - SY.policy
      - SY.timer
