hive_id: "motherbee"
role: motherbee

# WAN / inter-hive gateway.
wan:
  listen: "0.0.0.0:9000"
  gateway_name: "RT.gateway"
  uplinks:
    - address: "192.168.8.220:9000"

# Local NATS broker for control/data plane.
nats:
  mode: embedded
  port: 4222

# Local admin HTTP API.
admin:
  listen: "127.0.0.1:8080"

# Local architect HTTP UI/API (typically exposed through reverse proxy).
architect:
  listen: "127.0.0.1:3000"

# Shared filesystem root used by admin/orchestrator.
storage:
  path: "/var/lib/fluxbee"

# Identity runtime settings.
identity:
  sync:
    port: 9100

# Government/frontdesk wiring.
government:
  identity_frontdesk: "SY.frontdesk.gov@motherbee"

# Blob runtime config.
blob:
  enabled: true
  path: "/var/lib/fluxbee/blob"
  sync:
    enabled: true
    tool: "syncthing"
    api_port: 8384
    data_dir: "/var/lib/fluxbee/syncthing"

# Runtime artifact distribution config.
dist:
  path: "/var/lib/fluxbee/dist"
  sync:
    enabled: true
    tool: "syncthing"

# Declarative SY topology per hive role. SY.identity is always first by
# contract: it seeds the fixed fluxbee root tenant and deterministic system
# ILKs before any other SY needs identity metadata. `nodes` is the start
# order; `wait_for` is the subset the orchestrator blocks on before
# continuing bootstrap. Workers do not run SY.vault.
system_nodes:
  motherbee:
    # Boot order matters in Model D' (vault):
    #
    # 1. SY.config.routes — writes routing SHM, prereq for the router to
    #    deliver messages between everyone below.
    # 2. SY.vault — opens vault.db (AES-256-GCM at rest) and registers
    #    itself in the router. Must be ready BEFORE any consumer (admin /
    #    architect / storage / identity / cognition) does its first
    #    `resolve_resource` lookup, otherwise that lookup gets
    #    VAULT_UNAVAILABLE and the node falls to `secret_source = Missing`.
    #    Once vault is up, VAULT_SECRET_CHANGED broadcasts handle any
    #    later put/rotate/delete; consumers that arrive degraded receive
    #    the event on the next put (or on operator-initiated restart).
    # 3. SY.identity — writes identity SHM (needed for vault auth) and
    #    consumes its own postgres secret from vault. Putting it after
    #    SY.vault avoids the chicken/egg of identity needing vault and
    #    vault needing identity SHM (vault has a dedicated-match fallback
    #    that doesn't require SHM, used for identity's boot lookup).
    # The remaining nodes follow in their previous order.
    nodes:
      - SY.config.routes
      - SY.vault
      - SY.identity
      - SY.opa.rules
      - SY.admin
      - SY.architect
      - SY.storage
      - SY.cognition
      - SY.policy
      - SY.timer
      - SY.wf-rules
      - SY.frontdesk.gov
    wait_for:
      - SY.config.routes
      - SY.vault
      - SY.identity
      - SY.opa.rules
      - SY.admin
      - SY.cognition
      - SY.policy
      - SY.timer
  worker:
    nodes:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.cognition
      - SY.policy
      - SY.timer
      - SY.wf-rules
    wait_for:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.cognition
      - SY.policy
      - SY.timer
