hive_id: "motherbee"
role: motherbee

# WAN / inter-hive gateway.
wan:
  listen: "0.0.0.0:9000"
  gateway_name: "RT.gateway"
  uplinks:
    - address: "192.168.8.220:9000"

# Local NATS broker for control/data plane.
nats:
  mode: embedded
  port: 4222

# Local admin HTTP API.
admin:
  listen: "127.0.0.1:8080"

# Local architect HTTP UI/API (typically exposed through reverse proxy).
architect:
  listen: "127.0.0.1:3000"

# Shared filesystem root used by admin/orchestrator.
storage:
  path: "/var/lib/fluxbee"

# Identity runtime settings.
identity:
  sync:
    port: 9100

# Government/frontdesk wiring.
government:
  identity_frontdesk: "SY.frontdesk.gov@motherbee"

# Blob runtime config.
blob:
  enabled: true
  path: "/var/lib/fluxbee/blob"
  sync:
    enabled: true
    tool: "syncthing"
    api_port: 8384
    data_dir: "/var/lib/fluxbee/syncthing"

# Runtime artifact distribution config.
dist:
  path: "/var/lib/fluxbee/dist"
  sync:
    enabled: true
    tool: "syncthing"

# Declarative SY topology per hive role. SY.identity is always first by
# contract: it seeds the fixed fluxbee root tenant and deterministic system
# ILKs before any other SY needs identity metadata. `nodes` is the start
# order; `wait_for` is the subset the orchestrator blocks on before
# continuing bootstrap. Workers do not run SY.vault.
system_nodes:
  motherbee:
    nodes:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.admin
      - SY.architect
      - SY.vault
      - SY.storage
      - SY.cognition
      - SY.policy
      - SY.timer
      - SY.wf-rules
      - SY.frontdesk.gov
    wait_for:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.admin
      - SY.cognition
      - SY.policy
      - SY.timer
  worker:
    nodes:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.cognition
      - SY.policy
      - SY.timer
      - SY.wf-rules
    wait_for:
      - SY.identity
      - SY.config.routes
      - SY.opa.rules
      - SY.cognition
      - SY.policy
      - SY.timer
