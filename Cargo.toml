[package]
name = "json-router"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "crates/fluxbee_sdk",
    "crates/fluxbee_ai_sdk",
    "nodes/ai/ai-generic",
    "nodes/gov/common",
    "nodes/gov/ai-frontdesk-gov",
    "nodes/test/io-test",
    "nodes/test/ai-test-gov",
]

[dependencies]
async-trait = "0.1"
tokio = { version = "1.37", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.7", features = ["v4", "v5", "serde"] }
memmap2 = "0.9"
nix = { version = "0.28", features = ["fs", "mman"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fluxbee-sdk = { path = "crates/fluxbee_sdk" }
fluxbee-ai-sdk = { path = "crates/fluxbee_ai_sdk" }
wasmtime = "19.0.0"
regex = "1.10"
tar = "0.4"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lancedb = "0.27.1"
arrow-array = "57.2"
arrow-schema = "57.2"
futures = "0.3"
tokio-stream = "0.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
# WAN mTLS peer-auth (mesh CA + per-hive leaf certs). `ring` provider to keep
# build deps light (no aws-lc-rs/cmake). See docs/history/onworking-coa/wan-mtls-peer-auth.md.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The rcgen and x509-parser that instant-acme brings, so the workspace builds one of each.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls-pemfile = "2"
x509-parser = "0.18"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service", "client-legacy", "http1", "http2"] }
# SY.admin's ACME client for the public edge's certificate (docs/acme-edge-certificates-v1.md §6).
# Pinned exactly; `ring` keeps aws-lc-rs out, and the CA's TLS is verified against the system
# store (the .deb depends on ca-certificates).
instant-acme = { version = "=0.8.5", default-features = false, features = ["ring", "hyper-rustls", "time"] }
# The platform roots an issued chain must verify to before it is stored (§6 step 5).
rustls-native-certs = "0.8"
# A plain GET of the ACME directory (its terms URL and profiles); declared as the AI SDK does.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The HTTPS client SY.admin hands instant-acme, so the CA's TLS is checked against the same roots
# as the directory and ARI reads: the system's, plus `acme.trust_anchor` (§3).
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12"] }
