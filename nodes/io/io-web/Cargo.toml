[package]
name = "io-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
# `mesh-tls`: the motherbee's mesh leaf, the client verifier that admits a connected ingress, and
# the hive registry (fluxbee_sdk::mesh).
fluxbee-sdk = { workspace = true, features = ["mesh-tls"] }
# The links' and sessions' MACs (docs/io-web-v2-stage-2-1.md §3).
hmac.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
io-common = { path = "../common" }
serde.workspace = true
serde_json.workspace = true
# hive.yaml's `architect.listen`, where io.web dials Archi (docs/io-web-v2-stage-2-2.md §4.2): the
# version fluxbee_sdk reads its YAML with.
serde_yaml = "0.9"
sha2.workspace = true
# TCP keepalive with its timings on io.web's sockets, the edge's and the upstreams' (§3.1, §4.2):
# the version tokio uses, with `all` for the probe count.
socket2 = { version = "0.6", features = ["all"] }
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# A link's `jti` and a session's `sid`: 16 random bytes each, from a v4 uuid (§5.5).
uuid.workspace = true
